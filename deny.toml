[advisories]
version = 2

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0", # FunDSP's file-level copyleft license.
    "Unicode-3.0",

    "Zlib",
]

# midir 0.11.1 → Android JNI; ISC is a permissive attribution license.
[[licenses.exceptions]]
name = "libloading"
version = "=0.7.4"
allow = ["ISC"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
