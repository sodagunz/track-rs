[package]
name = "track-rs"
description = "Blazingly Fast™ Audio tracker TUI written entire in Rust®"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository= "https://github.com/tomasguinzburg/track-rs"
readme="README.md"
keywords=["audio", "daw", "tracker", "production", "music"]
categories=["multimedia", "multimedia::audio", "command-line-interface"]

[dependencies]
ratatui = { version = "0.30.2", features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29.0"
anyhow = "1.0.104"
fundsp = "0.23.0"
cpal = "0.18.2"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
cargo = "deny"
multiple_crate_versions =  { level = "allow", priority = 1}
upper_case_acronyms = { level = "allow", priority = 1}
pedantic = "warn"
nursery = "warn"
